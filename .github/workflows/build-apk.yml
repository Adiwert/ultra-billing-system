name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.stewart.quoteinvoice --project-name quote_invoice_maker .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Quote \& Invoice"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: quote-invoice-maker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
